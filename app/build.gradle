plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.dvil.retui.fm"
    compileSdk 36

    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def releaseStoreFile = keystoreProperties["storeFile"]
    def releaseStorePassword = keystoreProperties["storePassword"]
    def releaseKeyAlias = keystoreProperties["keyAlias"]
    def releaseKeyPassword = keystoreProperties["keyPassword"]
    def hasReleaseSigning = releaseStoreFile
            && releaseStorePassword
            && releaseKeyAlias
            && releaseKeyPassword
            && rootProject.file(releaseStoreFile).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.dvil.retui.fm"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "0.1.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
