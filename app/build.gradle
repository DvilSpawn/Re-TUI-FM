plugins {
    id 'com.android.application'
}

android {
    namespace "com.dvil.retui.fm"
    compileSdk 36

    defaultConfig {
        applicationId "com.dvil.retui.fm"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
